[build-system]
requires = ["hatchling>=1.25", "hatch-vcs>=0.4,<1"]
build-backend = "hatchling.build"

[project]
name = "catmapper-mcp"
dynamic = ["version"]
description = "Local MCP server for the CatMapper API"
requires-python = ">=3.10"
dependencies = ["mcp>=1.9,<2", "httpx>=0.27,<1"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
catmapper-mcp = "catmapper_mcp.server:main"

[tool.hatch.version]
source = "vcs"
